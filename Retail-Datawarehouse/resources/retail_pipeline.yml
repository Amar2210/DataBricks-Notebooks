resources:
  jobs:
    retail_data_pipeline:
      name: "[${bundle.target}] Retail Data Warehouse Pipeline"

      performance_target: STANDARD

      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../notebooks/02_bronze_ingestion.ipynb

        - task_key: silver_transformation
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../notebooks/03_silver_transformation.ipynb

        - task_key: gold_business_layer
          depends_on:
            - task_key: silver_transformation
          notebook_task:
            notebook_path: ../notebooks/04_gold_business_layer.ipynb